<div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-danger text-white border-0">
        <h5 class="modal-title fw-bold">Reject Changes</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" id="rejectForm">
        {% csrf_token %}
        <div class="modal-body p-4 text-center">
          <p class="mb-1 text-danger fw-bold">Are you sure?</p>
          <p class="text-muted small">These proposed changes will be discarded. The original document will remain unchanged.</p>
        </div>
        <div class="modal-footer border-0 bg-light justify-content-center">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger fw-bold px-4">Yes, Reject</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="acceptModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-success text-white border-0">
        <h5 class="modal-title fw-bold">Accept Changes</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="POST" id="acceptForm">
        {% csrf_token %}
        <div class="modal-body p-4 text-center">
          <p class="mb-1 text-success fw-bold">Overwrite Original Document?</p>
          <p class="text-muted small">This action will apply the collaborator's changes to your document permanently.</p>
        </div>
        <div class="modal-footer border-0 bg-light justify-content-center">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success fw-bold px-4">Yes, Accept Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
