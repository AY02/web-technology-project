<div class="card shadow-sm border-0 h-100 flex-column">
  <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
    <h5 class="text-primary fw-bold mb-0">Documents</h5>
    
    {% if is_owner or is_collaborator %} 
      <a href="{% url 'documents:create_document' current_project.id %}" class="btn btn-sm btn-primary rounded-circle fw-bold text-white text-decoration-none" title="New Document">+</a>
    {% endif %}
  </div>
  
  <div class="card-body d-flex flex-column">
    <div class="flex-grow-1 overflow-auto mb-3" style="max-height: 280px;">
      <ul class="list-group list-group-flush">
        
        {% for doc in current_project.documents.all %}
        <li class="list-group-item d-flex align-items-center border-0 px-0 py-2 border-bottom">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-file-earmark-text text-secondary me-3" viewBox="0 0 16 16">
            <path d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1h-5zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5z"/>
            <path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5L9.5 0zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
          </svg>
          <a href="{% url 'documents:document_detail' doc.id %}" class="text-decoration-none fw-bold text-dark text-truncate">
            {{ doc.title }}
          </a>
        </li>
        {% empty %}
        <li class="list-group-item border-0 px-0 text-muted small">
          No documents uploaded yet.
        </li>
        {% endfor %}

      </ul>
    </div>
  </div>
</div>
