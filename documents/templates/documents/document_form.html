{% extends "base.html" %}

{% block title %}New Document - {{ project.title }}{% endblock %}

{% block content %}
<div class="container mt-4 mb-5" style="max-width: 800px;">
  
  <div class="mb-4">
    <a href="{% url 'dashboard_project' project.id %}" class="text-decoration-none text-muted fw-bold">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left me-1" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
      </svg>
      Back to Dashboard ({{ project.title }})
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white border-0 py-3">
      <h4 class="mb-0 fw-bold">Create New Document</h4>
    </div>
    
    <div class="card-body p-5">
      <form method="POST">
        {% csrf_token %}
        
        <div class="mb-4">
          <label class="form-label fw-bold text-muted">Title</label>
          {{ form.title }}
        </div>
        
        <div class="mb-4">
          <label class="form-label fw-bold text-muted">Document Content</label>
          {{ form.content }}
        </div>

        <div class="d-flex justify-content-end border-top pt-4">
          <a href="{% url 'dashboard_project' project.id %}" class="btn btn-outline-secondary me-2 fw-bold px-4">Cancel</a>
          <button type="submit" class="btn btn-primary fw-bold px-4">Save Document</button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
