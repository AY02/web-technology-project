{% extends "base.html" %}

{% block title %}Log In - AlmostFS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        
        <div class="text-center mb-4">
          <h2 class="text-primary fw-bold">Log In</h2>
          <p class="text-muted">Access your file system</p>
        </div>

        {% if form.errors %}
          <div class="alert alert-danger" role="alert">
            Incorrect username or password. Please try again.
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label text-muted fw-bold">Username</label>
            <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" class="form-control form-control-lg" required autofocus>
          </div>

          <div class="mb-4">
            <label for="{{ form.password.id_for_label }}" class="form-label text-muted fw-bold">Password</label>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" class="form-control form-control-lg" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Log In</button>
          </div>
        </form>

      </div>
      
      <div class="card-footer bg-light text-center py-3 border-0">
        <p class="mb-0 text-muted">
          Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Sign up here</a>
        </p>
      </div>
      
    </div>
    
  </div>
</div>
{% endblock %}
