{% extends "base.html" %}

{% block title %}Login - AlmostFS{% endblock %}

{% block content %}
  <h2>Login AlmostFS</h2>

  {% if form.errors %}
    <p style="color: red;">Your username or password is incorrect. Please try again.</p>
  {% endif %}

  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>

  <p>Don't have an account? <a href="{% url 'register' %}">Sign up here</a></p>
{% endblock %}
