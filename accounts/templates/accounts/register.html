{% extends "base.html" %}

{% block title %}Sign up - AlmostFS{% endblock %}

{% block content %}
  <h2>Create a new account AlmostFS</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
  </form>
  <p>Already have an account? <a href="{% url 'login' %}">Log in here</a></p>
{% endblock %}
